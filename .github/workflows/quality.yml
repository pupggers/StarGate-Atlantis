name: PHP quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: php-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: php-cs-fixer:3.95.26

      - name: Check PHP syntax
        shell: bash
        run: |
          paths=(src)
          if [ -d tests ]; then paths+=(tests); fi
          find "${paths[@]}" -type f -name '*.php' -print0 \
            | xargs -0 -r -n 1 php -l

      - name: Check formatting
        run: >
          php-cs-fixer fix
          --config=.php-cs-fixer.dist.php
          --dry-run
          --diff
          --using-cache=no
